{% extends 'core/base.html' %}

{% block title %}Feedback - MovieDB{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-gray-800 rounded-xl p-8 shadow-2xl">
        <h1 class="text-3xl font-bold mb-6 flex items-center gap-3">
            <i data-lucide="message-square" class="text-purple-500"></i>
            Send Feedback
        </h1>

        <p class="text-gray-300 mb-8">
            We'd love to hear your thoughts! Whether it's a feature request, a bug report, or just saying hello, let us
            know.
        </p>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label for="subject" class="block text-sm font-medium text-gray-400 mb-2">Subject</label>
                <input type="text" id="subject" name="subject" required
                    class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-colors">
            </div>

            <div>
                <label for="message" class="block text-sm font-medium text-gray-400 mb-2">Message</label>
                <textarea id="message" name="message" rows="5" required
                    class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-colors"></textarea>
            </div>

            <button type="submit"
                class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition-all transform hover:scale-[1.02]">
                Submit Feedback
            </button>
        </form>
    </div>
</div>
{% endblock %}
