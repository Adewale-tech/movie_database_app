{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Discover trending movies, watch trailers, and create your watchlist. The ultimate movie database experience.">
    <meta name="theme-color" content="#111827">
    <title>{% block title %}MovieDB - Discover & Watch{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a202c;
        }

        ::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #718096;
        }
    </style>
</head>

<body class="bg-gray-900 text-white font-sans antialiased min-h-screen flex flex-col">
    <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo and Search -->
                <div class="flex items-center gap-8">
                    <a href="{% url 'core:home' %}" class="flex items-center gap-2">
                        <i data-lucide="film" class="w-8 h-8 text-purple-500"></i>
                        <span
                            class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600">MovieDB</span>
                    </a>

                    <div class="hidden md:block">
                        <form action="{% url 'core:search' %}" method="get" class="relative">
                            <input type="text" name="q" placeholder="Search movies..."
                                class="bg-gray-700 text-white rounded-full py-1 px-4 pl-10 focus:outline-none focus:ring-2 focus:ring-purple-500 w-64 transition-all duration-300 focus:w-80">
                            <i data-lucide="search" class="absolute left-3 top-1.5 w-4 h-4 text-gray-400"></i>
                        </form>
                    </div>
                </div>

                <!-- Navigation Links -->
                <div class="flex items-center gap-4">
                    <a href="{% url 'core:feedback' %}"
                        class="text-gray-300 hover:text-white transition-colors">Feedback</a>

                    {% if user.is_authenticated %}
                    <a href="{% url 'core:watchlist' %}" class="text-gray-300 hover:text-white transition-colors">My
                        Watchlist</a>
                    <span class="text-gray-600">|</span>
                    <span class="text-gray-300">{{ user.username }}</span>
                    <form action="{% url 'accounts:logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit"
                            class="text-gray-300 hover:text-white ml-2 transition-colors">Logout</button>
                    </form>
                    {% else %}
                    <a href="{% url 'accounts:login' %}"
                        class="text-gray-300 hover:text-white transition-colors">Login</a>
                    <a href="{% url 'accounts:signup' %}"
                        class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-1.5 rounded-full text-sm font-medium transition-colors">
                        Sign Up
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 border-t border-gray-700 mt-auto">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-gray-400 text-sm">
                &copy; 2025 MovieDB. Powered by TMDB.
            </p>
        </div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
